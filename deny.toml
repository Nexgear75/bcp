# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
]
all-features = true

[advisories]
# Fail on vulnerabilities, unmaintained and unsound crates (defaults).
ignore = []

[licenses]
# Permissive licenses only (the project is MIT OR Apache-2.0).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[licenses.private]
# Unpublished workspace crates (xtask) are not checked.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
