[workspace]
members = ["progress_copy", "bcp", "bmv", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Nexgear75/bcp"
homepage = "https://github.com/Nexgear75/bcp"
readme = "README.md"
description = "cp and mv with progress bars, atomic writes and data-loss protection"
categories = ["command-line-utilities", "filesystem"]
keywords = ["cp", "mv", "copy", "progress", "cli"]

[workspace.dependencies]
progress_copy = { path = "progress_copy", version = "0.1.0" }
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive", "wrap_help"] }
libc = "0.2.186"
filetime = "0.2.29"
tempfile = "3.27.0"
assert_cmd = "2.2.2"
predicates = "3.1.4"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
# Keep unwinding: destructors remove temp files even if a worker panics.
panic = "unwind"
