[package]
name = "progress_copy"
version = "0.1.0"
edition = "2024"

[dependencies]
indicatif = "0.18.4"
tempfile = "3.27.0"
ctrlc = { version = "3.5.2", features = ["termination"] }
thiserror = "2.0.18"
anyhow = "1.0.102"
fs-err = "3.3.0"
